sistant · Auburn University   ·   Software Developer · ITC Infotech</text><text x="48" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.6">studied</text><text x="138" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="1">M.S. Computer Science · Auburn   ·   B.Tech EEE · NIT Mizoram</text><text x="48" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" font-style="normal" letter-spacing="3" text-anchor="start" fill="#292322" fill-opacity="0.75">WORK</text><line x1="48" y1="274" x2="812" y2="274" stroke="#292322" stroke-opacity="0.35"/><text x="48" y="304" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="1">AgentReplay</text><text x="228" y="304" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">Built record-and-replay for LLM agents. Runs replay offline,</text><text x="228" y="323" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">and any change in an agent's behaviour fails CI.</text><text x="48" y="364" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="1">InferencePilot</text><text x="228" y="364" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">Building a vLLM benchmarker that sweeps serving configs</text><text x="228" y="383" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">and recommends only what it actually measured.</text><text x="48" y="424" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="1">KernelForge</text><text x="228" y="424" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">Writing Triton kernels for softmax, LayerNorm and attention,</text><text x="228" y="443" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">held to A100 targets fixed before the first run.</text><text x="48" y="484" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="1">Feather AI</text><text x="228" y="484" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">Built a local LLM quantization lab with speed, memory and</text><text x="228" y="503" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">quality checks. 1.77× faster decode.</text><text x="48" y="544" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="1">API Gateway</text><text x="228" y="544" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">Built a distributed gateway with JWT auth, Redis rate</text><text x="228" y="563" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">limiting, circuit breakers and request tracing.</text><text x="48" y="604" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="1">DocuIntel AI</text><text x="228" y="604" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">Built a multi-tenant RAG platform that answers from your</text><text x="228" y="623" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">documents, grounded and cited.</text><text x="48" y="664" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="1">DeployGuard AI</text><text x="228" y="664" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">Built release comparison that flags regressions and</text><text x="228" y="683" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.9">deployment risk before rollout.</text><text x="48" y="728" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" font-style="normal" letter-spacing="3" text-anchor="start" fill="#292322" fill-opacity="0.75">PUBLISHED</text><line x1="48" y1="740" x2="812" y2="740" stroke="#292322" stroke-opacity="0.35"/><text x="48" y="768" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" font-style="normal" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="1">LAXMI: AI-Based System for Smart, Energy-Efficient, and Secure Video Footage Processing</text><text x="48" y="788" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" font-style="italic" letter-spacing="0" text-anchor="start" fill="#292322" fill-opacity="0.8">The Journal of Supercomputing · Springer · 2025</text><text x="48" y="828" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" font-style="normal" letter-spacing="3" text-anchor="start" fill="#292322" fill-opacity="0.75">TOOLKIT</text><line x1="48" y1="840" x2="812" y2="840" stroke="#292322" stroke-opacity="0.35"/><rect x="48" y="858" width="67.6" height="24" fill="none" stroke="#292322" stroke-opacity="0.7"/><text x="81.8" y="874.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="normal" font-style="normal" letter-spacing="0" text-anchor="middle" fill="#292322" fill-opacity="1">Python</text><rect x="123.6" y="858" width="52.4" height="24" fill="none" stroke="#292322" stroke-opacity="0.7"/><text x="149.79999999999998" y="874.5" font-family="ui-monospace, SFMono-Regular, Menlo, 